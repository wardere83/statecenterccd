name: Finalize SCCCD tutorial
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-scccd-tutorial.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scccd-tutorial-finalization
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/tmp/scccd-install.log 2>&1 || { tail -40 /tmp/scccd-install.log; exit 1; }
          python -m pip install -q playwright PyYAML
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Repair narration, render and verify
        shell: python
        run: |
          import subprocess, yaml
          from pathlib import Path
          seed = subprocess.check_output(['git','show','bfe46163674f11c49358b4db961ba7ea92d6df86:.github/workflows/finalize-scccd-tutorial.yml'],text=True)
          specification = yaml.safe_load(seed)
          code = next(s['run'] for s in specification['jobs']['finalize']['steps'] if s.get('name')=='Build and verify tutorial')
          old = "html=html.replace('</body>',js+'\\n</body>',1)"
          new = "html=(js+'\\n</body>').join(html.rsplit('</body>',1))"
          assert old in code, 'Verified injection anchor not found'
          code = code.replace(old,new,1)
          code = code.replace("browser=p.chromium.launch(args=['--no-sandbox'])", "browser=p.chromium.launch(channel='chrome' if shutil.which('google-chrome') else None,args=['--no-sandbox','--autoplay-policy=no-user-gesture-required'])")
          audio_repair = r'''
          # Preserve the original narrator and all intact speech. Cut the interrupted
          # Timeline fragment and silence at verified silent boundaries.
          cut_start, cut_end = 73.2, 81.3
          cut_length = cut_end - cut_start
          def timestamp(value):
              parts=value.split(':')
              if len(parts)==2:
                  parts.insert(0,'0')
              h,m,s=parts
              return int(h)*3600+int(m)*60+float(s)
          def formatted(value):
              ms=round(value*1000)
              h,ms=divmod(ms,3600000)
              m,ms=divmod(ms,60000)
              s,ms=divmod(ms,1000)
              return f'{h:02d}:{m:02d}:{s:02d}.{ms:03d}'
          adjusted=[]
          removed=[]
          matches=re.findall(r'((?:\d{2}:)?\d{2}:\d{2}\.\d{3}) --> ((?:\d{2}:)?\d{2}:\d{2}\.\d{3})\n(.*?)(?=\n\n|\Z)',captions,re.S)
          assert len(matches)==32, f'Expected 32 source captions; received {len(matches)}'
          for a,b,text in matches:
              a,b=timestamp(a),timestamp(b)
              if a>=cut_start and b<=cut_end:
                  removed.append(text)
                  continue
              assert not (a<cut_start<b) and not (a<cut_end<b), 'Caption straddles edit'
              if a>=cut_end:
                  a-=cut_length
                  b-=cut_length
              adjusted.append(f'{len(adjusted)+1}\n{formatted(a)} --> {formatted(b)}\n{text.strip()}')
          assert len(adjusted)==31 and len(removed)==1, 'Unexpected caption edit'
          assert 'coordinating activities' in removed[0], 'Wrong caption removed'
          captions='WEBVTT\n\n'+'\n\n'.join(adjusted)+'\n\n'
          (assets/'scccd-tutorial-en.vtt').write_text(captions)
          repaired=work/'narration-repaired.mp4'
          run(['ffmpeg','-v','error','-y','-i',str(source),'-i',str(assets/'scccd-tutorial-en.vtt'),'-filter_complex',f'[0:a]asplit=2[x][y];[x]atrim=end={cut_start},asetpts=PTS-STARTPTS[a];[y]atrim=start={cut_end},asetpts=PTS-STARTPTS[b];[a][b]concat=n=2:v=0:a=1[out]','-map','[out]','-map','1:0','-c:a','aac','-b:a','192k','-c:s','mov_text','-t',str(duration-cut_length),str(repaired)])
          source=repaired
          duration=float(probe(source)['format']['duration'])
          audio_check=subprocess.run(['ffmpeg','-hide_banner','-nostats','-i',str(source),'-map','0:a:0','-af','silencedetect=noise=-45dB:d=4','-f','null','-'],capture_output=True,text=True,check=True)
          assert 'silence_start' not in audio_check.stderr, 'Unexpected long audio dropout'
          (work/'audio-continuity-check.txt').write_text(audio_check.stderr)
          print('Original narrator retained. Timeline interruption removed. Captions retimed. No silence over 4 seconds.',flush=True)
          '''
          anchor="captions=(assets/'scccd-tutorial-en.vtt').read_text()"
          assert anchor in code
          code=code.replace(anchor,anchor+'\n'+audio_repair,1)
          code=code.replace("wrapper='''", "scenes=[(t-cut_length if t>=cut_end else t,*rest) for t,*rest in scenes]\nwrapper='''",1)
          code=code.replace('Original narration preserved.','Original voice. Continuous narration.')
          code=code.replace("'approved_narration_bit_identical':True", "'repaired_audio_stream_preserved':True,'original_narrator_retained':True,'timeline_dropout_removed':True,'unexpected_silences_over_4_seconds':0")
          Path('.tutorial-render-executed.py').write_text(code)
          exec(compile(code,'scccd-tutorial-production','exec'))
      - name: Publish files to repository
        run: |
          git config user.name "Bulle Consulting"
          git config user.email "137476259+wardere83@users.noreply.github.com"
          git add index.html assets/tutorial
          git diff --cached --quiet || git commit -m "Publish sharp 4K tutorial with continuous narration and responsive dashboard navigation"
          git push origin HEAD:main
      - name: Upload completed files
        uses: actions/upload-artifact@v4
        with:
          name: SCCCD-4K-Tutorial-and-Dashboard
          path: .tutorial-publish/
          include-hidden-files: true
      - name: Upload QA previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCCCD-Tutorial-QA
          path: |
            .tutorial-build/*.png
            .tutorial-build/audio-continuity-check.txt
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .tutorial-publish/
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
